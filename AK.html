<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akamai Player - Perfect 4:3 Crop</title>
    
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(18, 22, 28, 0.95);
            --text-color: #c9d1d9;
            --accent: #2f81f7;
            --border: #30363d;
        }

        /* 
           1. CINEMATIC BLACK BACKGROUND & NO SCROLLING
           Locks the screen and ensures the "else area" is always black.
        */
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* NO SCROLLBARS */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 
           2. THE VISIBLE VIDEO AREA (Strictly 4:3)
           Everything outside this box is hidden or black.
        */
        .player-wrapper {
            position: relative;
            background-color: #000;
            overflow: hidden; /* Slices off the 205px header perfectly */
            /* Width, Height, and Aspect Ratio are strictly managed by JS below */
        }

        iframe {
            position: absolute;
            left: 0; border: none;
            transform-origin: top left;
        }

        /* --- SETTINGS PANEL --- */
        .controls-container {
            position: absolute; top: 15px; left: 15px; right: 15px;
            max-width: 800px; margin: 0 auto;
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            z-index: 100; transition: opacity 0.3s, transform 0.3s;
        }
        
        .controls-container.hidden {
            opacity: 0; pointer-events: none; transform: translateY(-20px);
        }

        .controls-title {
            margin: 0 0 15px 0; font-size: 1.1rem; font-weight: 600; color: #fff;
            display: flex; justify-content: space-between; align-items: center;
        }

        .input-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px; margin-bottom: 15px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.8rem; color: #8b949e; font-weight: 500; }
        .input-group input {
            padding: 8px; background: #010409; border: 1px solid var(--border);
            color: #fff; border-radius: 6px; font-size: 14px; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); }

        .apply-btn {
            width: 100%; padding: 12px; background: var(--accent); color: #fff;
            border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; 
            cursor: pointer; transition: 0.2s;
        }
        .apply-btn:hover { background: #1f6feb; }

        .settings-toggle {
            position: absolute; bottom: 15px; right: 15px; z-index: 101;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 10px 15px; border-radius: 20px; cursor: pointer;
            backdrop-filter: blur(5px); font-size: 0.9rem; font-weight: bold;
        }
        .settings-toggle:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <!-- SETTINGS TOGGLE -->
    <button class="settings-toggle" onclick="toggleSettings()">⚙️ Toggle Settings</button>

    <!-- FLOATING CONTROL PANEL -->
    <div class="controls-container hidden" id="controlsPanel">
        <div class="controls-title">
            <span>Embed Configuration</span>
        </div>
        <div class="input-grid">
            <div class="input-group">
                <label>Aspect Ratio</label>
                <!-- Set to 4/3 as requested -->
                <input type="text" id="inpRatio" value="4/3">
            </div>
            <div class="input-group">
                <label>Forced Desktop Width</label>
                <!-- Set to 650 as requested -->
                <input type="number" id="inpDesktop" value="650">
            </div>
            <div class="input-group">
                <label>Desktop Header Crop (px)</label>
                <!-- Set to 205 as requested -->
                <input type="number" id="inpCrop" value="205">
            </div>
        </div>
        <button class="apply-btn" onclick="applyDimensions()">Apply & Hide Settings</button>
    </div>

    <!-- THE PLAYER CONTAINER (The 4:3 Visible Area) -->
    <div class="player-wrapper" id="playerWrapper">
        <iframe 
            id="akamaiIframe"
            src="https://players.akamai.com/players/hlsjs?streamUrl=https://cloudplay-sonyliv.pages.dev/ten3hd.m3u8" 
            allowfullscreen 
            allow="autoplay; fullscreen; encrypted-media">
        </iframe>
    </div>

    <script>
        const wrapper = document.getElementById('playerWrapper');
        const iframe = document.getElementById('akamaiIframe');
        const panel = document.getElementById('controlsPanel');

        function toggleSettings() {
            panel.classList.toggle('hidden');
            setTimeout(applyDimensions, 100);
        }

        function applyDimensions() {
            if (!event || event.type === 'click') panel.classList.add('hidden');

            const ratioStr = document.getElementById('inpRatio').value.trim();
            const desktopWidth = parseFloat(document.getElementById('inpDesktop').value.trim()) || 650;
            const desktopHeaderHeight = parseFloat(document.getElementById('inpCrop').value.trim()) || 205;

            // 1. STRICT 4:3 CONTAINMENT MATH (No Overflow, Rest is Black)
            if (ratioStr.includes('/')) {
                const parts = ratioStr.split('/');
                const ratioNum = parseFloat(parts[0]) / parseFloat(parts[1]);
                
                wrapper.style.aspectRatio = ratioStr;
                wrapper.style.width = '100%';
                wrapper.style.height = '100%';
                
                // These two lines guarantee the box NEVER exceeds the screen, 
                // framing the 4:3 area perfectly in the center of the black background.
                wrapper.style.maxWidth = `calc(100vh * ${ratioNum})`; 
                wrapper.style.maxHeight = `calc(100vw / ${ratioNum})`;
            }

            // 2. Wait 50ms for CSS to reshape the strict 4:3 box, then slice the video
            setTimeout(() => {
                scaleIframe(desktopWidth, desktopHeaderHeight);
            }, 50);
        }

        function scaleIframe(desktopWidth, desktopHeaderHeight) {
            // Get the resulting exact pixel size of the black 4:3 wrapper box
            const wrapperWidth = wrapper.clientWidth;
            const wrapperHeight = wrapper.clientHeight;

            // --- THE RESPONSIVE CROP MATH ---
            // Calculate how much we are shrinking or enlarging the 650px layout
            const scaleRatio = wrapperWidth / desktopWidth;

            // Multiply your 205px crop by the scale ratio. 
            // If the 650px frame gets shrunk to fit a phone, the 205px crop shrinks perfectly with it.
            const scaledCropPx = desktopHeaderHeight * scaleRatio;

            // 1. Shift the iframe up by the exact computed amount to slice the 205px header off
            iframe.style.top = `-${scaledCropPx}px`;

            // 2. Force the Iframe into the 650px Forced Desktop mode
            iframe.style.width = desktopWidth + 'px';
            
            // 3. Fix the Bottom Gap
            // Because we shifted the top up, we extend the bottom to make sure the remaining video fills the 4:3 box.
            const requiredVisualHeight = wrapperHeight + scaledCropPx;
            iframe.style.height = (requiredVisualHeight / scaleRatio) + 'px';

            // 4. Shrink/Enlarge it natively using GPU transforms
            iframe.style.transform = `scale(${scaleRatio})`;
        }

        // Initialize perfectly on first load
        window.addEventListener('DOMContentLoaded', applyDimensions);
        
        // Keep it scaled properly without causing scrollbars if the screen rotates
        window.addEventListener('resize', applyDimensions);
    </script>

</body>
</html>
