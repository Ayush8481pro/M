<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream - Akamai Player</title>
    
    <style>
        :root {
            --bg-color: #0f1115;
        }

        /* Basic page reset for a cinematic look */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Responsive 16:9 Container */
        .player-wrapper {
            position: relative;
            width: 90%;
            max-width: 1200px;
            aspect-ratio: 16 / 9; /* Keeps the perfect video ratio */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2e37;
        }

        /* Iframe takes up the whole wrapper */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Simple Title */
        .title {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="title">Live Sports Stream (Ten 3 HD)</div>

    <div class="player-wrapper">
        <!-- The Akamai Player Embedded Here -->
        <iframe 
            src="https://players.akamai.com/players/hlsjs?streamUrl=https://cloudplay-sonyliv.pages.dev/ten3hd.m3u8" 
            allowfullscreen 
            allow="autoplay; fullscreen; encrypted-media">
        </iframe>
    </div>

</body>
</html>
