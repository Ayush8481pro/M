<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akamai Player - Responsive Crop Tester</title>
    
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --accent: #2f81f7;
            --border: #30363d;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            /* Prevents the 110% width from creating ugly horizontal page scrollbars */
            overflow-x: hidden; 
        }

        /* --- CONTROL PANEL STYLES --- */
        .controls-container {
            width: 90%; max-width: 1100px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 20px;
            margin: 20px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .controls-title {
            margin: 0 0 15px 0; font-size: 1.2rem; font-weight: 600; color: #fff;
            text-align: center;
        }

        .input-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px; margin-bottom: 15px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.85rem; color: #8b949e; font-weight: 500; }

        .input-group input {
            padding: 10px; background: #010409; border: 1px solid var(--border);
            color: #fff; border-radius: 6px; font-size: 14px; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); }

        .apply-btn {
            width: 100%; padding: 12px; background: var(--accent);
            color: #fff; border: none; border-radius: 6px;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .apply-btn:hover { background: #1f6feb; }

        /* --- PLAYER STYLES --- */
        .player-wrapper {
            position: relative;
            background-color: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            /* Hides everything outside the box (crucial for cropping) */
            overflow: hidden; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            
            /* Initial Defaults */
            width: 110%; aspect-ratio: 4/3; height: 50vh;
        }

        iframe {
            position: absolute;
            left: 0; border: none;
            /* Scales from the top left corner */
            transform-origin: top left;
        }

        .size-indicator {
            margin-top: 15px; font-size: 0.9rem; color: #8b949e; margin-bottom: 20px;
            text-align: center; line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- LIVE CONTROL PANEL -->
    <div class="controls-container">
        <h2 class="controls-title">⚙️ Responsive Dimension & Crop Tester</h2>
        <div class="input-grid">
            <div class="input-group">
                <label>Container Width</label>
                <input type="text" id="inpWidth" value="110%">
            </div>
            <div class="input-group">
                <label>Container Height</label>
                <input type="text" id="inpHeight" value="50vh">
            </div>
            <div class="input-group">
                <label>Aspect Ratio</label>
                <input type="text" id="inpRatio" value="4/3">
            </div>
            <div class="input-group">
                <label>Forced Desktop Width</label>
                <input type="number" id="inpDesktop" value="1180">
            </div>
            <div class="input-group">
                <!-- Using Percentage ensures the same visual proportion is cropped on all devices -->
                <label>Top Crop % (Responsive)</label>
                <input type="text" id="inpCrop" value="12%">
            </div>
        </div>
        <button class="apply-btn" onclick="applyDimensions()">Apply Dimensions Live</button>
    </div>

    <!-- THE PLAYER CONTAINER -->
    <div class="player-wrapper" id="playerWrapper">
        <iframe 
            id="akamaiIframe"
            src="https://players.akamai.com/players/hlsjs?streamUrl=https://cloudplay-sonyliv.pages.dev/ten3hd.m3u8" 
            allowfullscreen 
            allow="autoplay; fullscreen; encrypted-media">
        </iframe>
    </div>
    
    <div class="size-indicator" id="sizeIndicator">Calculating Dimensions...</div>

    <!-- JAVASCRIPT FOR DYNAMIC SIZING, PERCENTAGE CROPPING, AND DESKTOP TRICK -->
    <script>
        const wrapper = document.getElementById('playerWrapper');
        const iframe = document.getElementById('akamaiIframe');
        const indicator = document.getElementById('sizeIndicator');

        function applyDimensions() {
            // 1. Get values from the inputs
            const widthVal = document.getElementById('inpWidth').value.trim();
            const heightVal = document.getElementById('inpHeight').value.trim();
            const ratioVal = document.getElementById('inpRatio').value.trim();
            const desktopWidthVal = parseInt(document.getElementById('inpDesktop').value.trim()) || 1180;
            const cropVal = document.getElementById('inpCrop').value.trim() || '0%';

            // 2. Apply CSS to the Container Wrapper
            wrapper.style.width = widthVal;

            if (heightVal.toLowerCase() === 'auto' || heightVal === '') {
                wrapper.style.height = 'auto';
                wrapper.style.aspectRatio = ratioVal !== 'none' ? ratioVal : '4/3';
            } else {
                wrapper.style.height = heightVal;
                wrapper.style.aspectRatio = ratioVal !== 'none' ? ratioVal : 'unset';
            }

            // 3. Wait 50ms for the browser to visually draw the new container size, then scale the iframe
            setTimeout(() => {
                scaleIframe(desktopWidthVal, cropVal);
            }, 50);
        }

        function scaleIframe(desktopWidth, cropString) {
            // Get the exact pixel size of the wrapper box generated by the device's screen
            const wrapperWidth = wrapper.clientWidth;
            const wrapperHeight = wrapper.clientHeight;

            // --- THE RESPONSIVE PERCENTAGE MATH ---
            let cropPx = 0;
            if (cropString.includes('%')) {
                // If user entered a percentage (e.g., 12%), dynamically calculate it based on the container's height
                // This ensures it scales proportionally whether viewed on a TV or a Phone.
                cropPx = wrapperHeight * (parseFloat(cropString) / 100);
            } else {
                // Fallback for strict pixel values (e.g. 50px)
                const measureDiv = document.createElement('div');
                measureDiv.style.position = 'absolute';
                measureDiv.style.visibility = 'hidden';
                measureDiv.style.height = cropString;
                document.body.appendChild(measureDiv);
                cropPx = measureDiv.getBoundingClientRect().height || 0;
                document.body.removeChild(measureDiv);
            }

            // Calculate the shrinking ratio to make the massive desktop layout fit the container width
            const scaleRatio = wrapperWidth / desktopWidth;

            // Update Indicator text on the webpage to show exactly what's happening
            indicator.innerHTML = `Rendered Container Size: <b>${wrapperWidth}px by ${wrapperHeight}px</b> <br> Visually Cropped from Top: <b>${cropPx.toFixed(1)}px</b> (Scales Automatically)`;

            // 1. Shift the iframe up by the exact computed crop amount (moves the header out of the box)
            iframe.style.top = `-${cropPx}px`;

            // 2. Force the Iframe to render in Desktop Landscape width
            iframe.style.width = desktopWidth + 'px';
            
            // 3. Because we shifted the top UP, the bottom of the video would end up short.
            // We calculate the required visual height (wrapper + crop), and un-scale it to get the raw height needed.
            const requiredVisualHeight = wrapperHeight + cropPx;
            iframe.style.height = (requiredVisualHeight / scaleRatio) + 'px';

            // 4. Visually shrink it down
            iframe.style.transform = `scale(${scaleRatio})`;
        }

        // Initialize perfectly on first load
        window.addEventListener('DOMContentLoaded', applyDimensions);
        
        // Keep it scaled properly if the user resizes the browser window or rotates their phone
        window.addEventListener('resize', applyDimensions);
    </script>

</body>
</html>
